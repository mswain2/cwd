<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<title>CSS Battle</title>

		<style>

			body {
				background-color: #12219A;
				padding: 20px;
				display: flex;
				flex-direction: column;
				height: 90vh;
				justify-content: space-between;
			}

			.square {
				background-color: #70CCDB;
				width: 100px;
				height: 100px;
			}

			.circle {
				background-color: #DB5EAD;
				width: 100px;
				height: 100px;
				border-radius: 100%;
			}

			div {
				display: flex;
				justify-content: space-between;
				width: 225px;
			}

			.top {
				display: flex;
				justify-content: space-between;
				width: 100%;
			}

			.bottom {
				display: flex;
				justify-content: space-between;
				width: 100%;
				
			}

		</style>
		
	</head>
	<body>
		<div class="top">
			<div>
				<div class="square"></div>
				<div class="circle"></div>
			</div>

			<div>
				<div class="circle"></div>
				<div class="square"></div>
			</div>
		</div>

		<div class="bottom">
			<div>
				<div class="circle"></div>
				<div class="square"></div>
			</div>

			<div>
				<div class="square"></div>
				<div class="circle"></div>
			</div>
		</div>

	</body>
</html>
