<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- 
	About this page:
		For the Fake News assignment, I wanted to focus on news based on something that makes me really happy which is my dog. I wanted to have a mixture of news about my dog (his spa trips, his birthday) and funny general dog news (decline in treats, etc.). I really just wanted to have a positive paper that represented everything about dogs and my dog specifically. In my Figma prototype, I used a cute and fun font, included cute pictures of my dog, and made funny positive new titles and subtitles. I laid it out in a nice grid fashion with a perception of three columns and four rows.

	-->
	<title>Fake News</title>
	
  	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  	<!--I really liked the font from my Mockup so I found it on Google Fonts and embedded it.-->
  	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  	
  	<style>
  		:root {
  			/*I chose these colors to match the Dallas Cowboys partially and to get a color for the background*/
  			/* CSS HEX */
			--linen: #feefe5ff;
			--vibrant-coral: #ff715bff;
			--pacific-blue: #4da1a9ff;
			--charcoal-blue: #364f59ff;
			--jet-black: #28343eff;
  		}

  		body {
  			/*Set page font to Josefin Slab to match mockup*/
  			font-family: "Josefin Slab", serif;
  			/*Set background of page to */
  			background-color: var(--linen);
  		}

  		.row {
  			/*Add a border so I can see while setting up the layout*/
  			border: 1px solid black;
  		}

  		.col {
  			/*Add a border so I can see while setting up the layout*/
  			border: 1px solid black;
  		}

  	</style>
</head>
<body>
	<!-- I'm starting by setting up the basic layout for the grid. -->
	<div class="container text-center">
		<!--I am going to have four main rows with their own nested columns (and possibly more nested stuff)-->
		<div class="row">
			<!--This will likely have three columns, but we'll see.-->
			Title
		</div>

		<div class="row">
			<!--This row should have three column. The middle column will remain the same while the two outer columns will have two nested rows.-->
			<!--Two nested rows.-->
			<div class="col">
				<div class="row">
					First
				</div>
				<div class="row">
					Second
				</div>
			</div>

			<!--No nesting-->
			<div class="col">
				Middle chunk
			</div>

			<!--Two nested rows-->
			<div class="col">
				<div class="row">
					Third
				</div>
				<div class="row">
					Fourth
				</div>
			</div>
		</div>

		<!--This chunk will have three columns.-->
		<div class="row">
			<div class="col">
				Chunk 1
			</div>

			<div class="col">
				Chunk 2
			</div>

			<div class="col">
				Chunk 3
			</div>
		</div>

		<!--This is just a chunk for the copyright at the bottom. No need for nesting here.-->
		<div class="row">
			Copyright
		</div>
	</div>
	

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
